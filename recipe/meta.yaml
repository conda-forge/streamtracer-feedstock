{% set name = "streamtracer" %}
{% set version = "2.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/streamtracer-{{ version }}.tar.gz
  sha256: 31c424aae5f98cfbf1387e46cbaaf87a775cf036b54f99421ebbe190eaed597f

build:
  script:
    # https://github.com/conda-forge/maturin-feedstock/issues/152
    - rm $PREFIX/lib/python3.14/build-details.json  # [unix and build_platform != target_platform and py==314]
    - {{ PYTHON }} -m pip install . -vv
  number: 0
  skip: true  # [py<312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - maturin >=1.0,<2.0                     # [build_platform != target_platform]
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python
    - packaging >=21.3
    - numpy >=1.26

test:
  imports:
    - streamtracer
  commands:
    - pip check
    - pytest --pyargs streamtracer
  requires:
    - pip
    - pytest
    - pytest-doctestplus

about:
  home: https://streamtracer.readthedocs.io/en/latest/
  summary: Fast streamline tracing in python
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - STBadman
    - cadair
    - jgieseler
